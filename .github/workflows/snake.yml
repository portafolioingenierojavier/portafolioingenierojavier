# ═════════════════════════════════════════════════════════════
# 🐍 Generador de Serpiente de Contribuciones
# Fuente: https://github.com/Platane/snk
# ═════════════════════════════════════════════════════════════

name: 🐍 Generar serpiente de contribuciones

on:
  # 🔁 Se ejecuta automáticamente cada día a las 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # 🖱️ Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# ⚠️ PERMISOS — Esto es lo que faltaba para que funcione
permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1️⃣ Clonar el repositorio
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2️⃣ Generar los SVG de la serpiente
      - name: 🐍 Generar SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: portafolioingenierojavier
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3️⃣ Publicar los SVG en la rama "output"
      - name: 🚀 Deploy a rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
