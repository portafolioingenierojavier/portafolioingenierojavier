name: Generar serpiente de contribuciones

on:
  # Se ejecuta cada día a medianoche (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      # 1. Clonar el repositorio
      - uses: actions/checkout@v3

      # 2. Generar los SVG de la serpiente
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: portafolioingenierojavier
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Publicar los SVG en una rama llamada "output"
      - uses: crazy-max/ghaction-github-pages@v2.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}